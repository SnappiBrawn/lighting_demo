<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Light Toggle Demo</title>
    <style>
        /* Basic reset and centering for the demo */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            margin: 0;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        /* The Image Stacking Logic */
        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5; /* Matches typical product photography */
            border-radius: 8px;
            overflow: hidden;
            background-color: #eee; /* Placeholder color while loading */
            margin-bottom: 20px;
        }

        .base-image, .lit-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The lit image sits on top and fades in/out */
        .lit-image {
            z-index: 2;
            opacity: 0; 
            transition: opacity 0.4s ease-in-out; /* Smooth fade effect */
        }

        .lit-image.is-on {
            opacity: 1;
        }

        /* UI Styling below (Typography and Custom Toggle Switch) */
        .product-info h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: #333;
        }

        .product-info p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .controls span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #555;
        }

        /* Custom iOS-style toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <div class="product-card">
        
        <div class="controls">
            <span>Room Light</span>
            <label class="switch">
                <input type="checkbox" id="lightToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="image-container">
            <img src="lights_off.jpg" alt="Lamp turned off" class="base-image">
            
            <img src="lights_on.jpg" alt="Lamp turned on" class="lit-image" id="litOverlay">
        </div>

        <div class="product-info">
            <h2>The Scene</h2>
            <p>From $1,200.00</p>
        </div>

    </div>

    <script>
        // Grab the checkbox and the overlay image
        const toggleSwitch = document.getElementById('lightToggle');
        const litOverlay = document.getElementById('litOverlay');

        // Listen for changes on the toggle
        toggleSwitch.addEventListener('change', function() {
            if (this.checked) {
                // Turn light ON (fade in overlay)
                litOverlay.classList.add('is-on');
            } else {
                // Turn light OFF (fade out overlay)
                litOverlay.classList.remove('is-on');
            }
        });
    </script>
</body>
</html>
